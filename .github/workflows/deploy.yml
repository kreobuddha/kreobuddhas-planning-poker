name: Deploy

# The public demo. `master` is the deployed state of the app, so a push to it refreshes the site;
# `workflow_dispatch` is there for the first deploy and for re-running one that failed.
on:
  workflow_dispatch:
  push:
    branches: [master]

# Actions are pinned to a commit with the version beside it: a tag is a movable pointer and a
# commit is not.

permissions:
  contents: read

# A site has one live version, so overlapping runs would race to be it. A run already mid-deploy is
# not cancelled: cancelling it leaves the site serving half a deployment.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check

      # The Firebase web config is repository *variables*, not secrets, and deliberately so: every
      # value below is compiled into the bundle this job publishes, so anyone can read them from
      # the deployed JavaScript. Calling them secret would be theatre. What actually protects the
      # data is `firebase/firestore.rules` plus the provider and authorized-domain settings in the
      # Firebase console — see README, "The public demo".
      - name: Build the site
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "The Firebase repository variables are not set — see README, 'The public demo'." >&2
            exit 1
          fi
          npm run build

      # The Firestore emulator is a Java program, and the runner image's JDK is not something to
      # depend on silently.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Without this the emulator jar is downloaded on every single run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      # A gate, not a formality: the step below publishes these rules to the live demo, and this
      # job is the last thing standing between a broken rule and the only server-side boundary
      # the app has. It runs before either deploy so that a failure costs nothing.
      - run: npm run test:rules

      # Rules before the site, deliberately. Either order leaves a window where one half of a
      # release is live and the other is not; the question is which half. Rules first means the
      # window is the old app against the new rules — and the old app is what those rules were
      # reviewed against anyway. Site first means a new app against old rules: a client asking
      # for something the boundary has not learned to allow yet. 0.3.0 shipped that way, and no
      # room could be created until the rules caught up.
      #
      # Deployed from here rather than by hand, because a rules file that only exists in the
      # repository drifts from what is actually enforced, and nothing in the app can tell you
      # that it has. Its own service account, holding Firebase Rules Admin and nothing else: the
      # key that can rewrite the security boundary is not also the key that publishes the site.
      - name: Deploy the Firestore rules
        env:
          FIREBASE_RULES_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_RULES_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_RULES_SERVICE_ACCOUNT is not set — see README, 'The public demo'." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-rules-service-account.json"
          (umask 077; printf '%s' "$FIREBASE_RULES_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            npx firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$key"

      # A service-account key, and the reason the deploy is not a bare `npm` command: it is
      # written outside the checkout, with a umask that keeps it to this user, and never echoed.
      # `firebase-tools` is already a devDependency, so no third-party action gets a look at it.
      # The account holds Firebase Hosting Admin and nothing else — it cannot touch Firestore or
      # its rules, which have their own key in the step above.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set — see README, 'The public demo'." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-service-account.json"
          (umask 077; printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            npx firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$key"
