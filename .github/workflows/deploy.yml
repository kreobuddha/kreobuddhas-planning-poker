name: Deploy

# The public demo. `master` is the deployed state of the app, so a push to it refreshes the site;
# `workflow_dispatch` is there for the first deploy and for re-running one that failed.
on:
  workflow_dispatch:
  push:
    branches: [master]

# Actions are pinned to a commit with the version beside it: a tag is a movable pointer and a
# commit is not.

permissions:
  contents: read

# A site has one live version, so overlapping runs would race to be it. A run already mid-deploy is
# not cancelled: cancelling it leaves the site serving half a deployment.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check

      # The Firebase web config is repository *variables*, not secrets, and deliberately so: every
      # value below is compiled into the bundle this job publishes, so anyone can read them from
      # the deployed JavaScript. Calling them secret would be theatre. What actually protects the
      # data is `firebase/firestore.rules` plus the provider and authorized-domain settings in the
      # Firebase console — see README, "The public demo".
      - name: Build the site
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "The Firebase repository variables are not set — see README, 'The public demo'." >&2
            exit 1
          fi
          npm run build

      # The one real secret in this repository, and the reason the deploy is not a bare `npm`
      # command: it is a service-account key, so it is written outside the checkout, with a umask
      # that keeps it to this user, and never echoed. `firebase-tools` is already a devDependency,
      # so no third-party action gets a look at it. The account holds Firebase Hosting Admin and
      # nothing else — it cannot touch Firestore or its rules, which are deployed by hand.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set — see README, 'The public demo'." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-service-account.json"
          (umask 077; printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            npx firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$key"
